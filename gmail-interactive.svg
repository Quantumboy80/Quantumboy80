<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .bg {
        fill: #090d16;
        stroke: #1f2937;
        stroke-width: 1.5;
        transition: all 0.3s ease;
      }
      
      .border-glow {
        fill: none;
        stroke: #ff007f;
        stroke-width: 2;
        stroke-dasharray: 620;
        stroke-dashoffset: 620;
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Back of envelope (Absolute coordinate system) */
      .env-back {
        fill: #1f2937;
        stroke: #4b5563;
        stroke-width: 1.5;
        transition: all 0.3s ease;
      }

      /* Letter card inside */
      .env-letter {
        fill: #00f3ff;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), fill 0.3s ease;
      }

      .env-front {
        fill: #0d121f;
        stroke: #4b5563;
        stroke-width: 1.5;
        transition: all 0.3s ease;
      }

      /* Envelope flap */
      .env-flap {
        fill: #1a2333;
        stroke: #4b5563;
        stroke-width: 1.5;
        transform-origin: 45px 28px; /* Hinge center point on canvas: x=25+20=45, y=20+8=28 */
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), fill 0.3s ease, stroke 0.3s ease;
      }

      .text {
        fill: #9ca3af;
        font-family: 'Share Tech Mono', monospace;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 2px;
        transition: all 0.3s ease;
      }

      /* Hover States */
      svg:hover .bg {
        fill: #190f18;
        stroke: #ff007f;
        filter: drop-shadow(0 0 5px rgba(255, 0, 127, 0.15));
      }
      svg:hover .border-glow {
        stroke-dashoffset: 0;
        filter: drop-shadow(0 0 6px #ff007f);
      }
      svg:hover .text {
        fill: #ff007f;
        filter: drop-shadow(0 0 2px rgba(255, 0, 127, 0.5));
      }
      
      /* Interactive envelope opening on hover */
      svg:hover .env-flap {
        transform: scaleY(-1);
        fill: #ff007f;
        stroke: #ff007f;
      }
      svg:hover .env-letter {
        transform: translateY(-13px);
        fill: #ff007f;
        filter: drop-shadow(0 0 4px #ff007f);
      }
      svg:hover .env-back, svg:hover .env-front {
        stroke: #ff007f;
      }
    </style>
  </defs>

  <!-- Outer card -->
  <rect x="5" y="5" width="230" height="60" rx="10" class="bg" />
  <rect x="5" y="5" width="230" height="60" rx="10" class="border-glow" />

  <!-- Interactive Envelope (Built using absolute coordinates to prevent scaling shifts) -->
  <g>
    <!-- Letter that slides up (Grouped so lines and backing card shift together) -->
    <g class="env-letter">
      <rect x="28" y="24" width="34" height="20" rx="2" />
      <line x1="33" y1="29" x2="47" y2="29" stroke="#090d16" stroke-width="1.5" />
      <line x1="33" y1="33" x2="57" y2="33" stroke="#090d16" stroke-width="1.5" />
      <line x1="33" y1="37" x2="51" y2="37" stroke="#090d16" stroke-width="1.5" />
    </g>

    <!-- Back of envelope -->
    <rect x="25" y="28" width="40" height="24" rx="2" class="env-back" />
    
    <!-- Front of envelope (lower cover) -->
    <path d="M 25,52 L 45,40 L 65,52 Z" class="env-front" />
    <path d="M 25,28 L 25,52 L 35,40 Z" class="env-front" />
    <path d="M 65,28 L 65,52 L 55,40 Z" class="env-front" />

    <!-- Flap (top cover) -->
    <path d="M 25,28 L 45,40 L 65,28 Z" class="env-flap" />
  </g>

  <!-- Badge Text -->
  <text x="85" y="40" class="text">SEND EMAIL</text>
</svg>
