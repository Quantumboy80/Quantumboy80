<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 65" width="220" height="65">
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .badge-bg {
        fill: #090d16;
        stroke: #1f2937;
        stroke-width: 1.5;
        transition: all 0.3s ease;
      }
      .badge-border {
        fill: none;
        stroke: #00f3ff;
        stroke-width: 2;
        stroke-dasharray: 550;
        stroke-dashoffset: 550;
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        filter: drop-shadow(0 0 2px rgba(0, 243, 255, 0.4));
      }
      .text {
        fill: #9ca3af;
        font-family: 'Share Tech Mono', monospace;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 2px;
        transition: all 0.3s ease;
      }
      .icon {
        fill: #9ca3af;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      
      /* Hover State */
      svg:hover .badge-bg {
        fill: #0e1626;
        stroke: #00f3ff;
        filter: drop-shadow(0 0 4px rgba(0, 243, 255, 0.15));
      }
      svg:hover .badge-border {
        stroke-dashoffset: 0;
        filter: drop-shadow(0 0 6px #00f3ff);
      }
      svg:hover .text {
        fill: #00f3ff;
        filter: drop-shadow(0 0 2px rgba(0, 243, 255, 0.5));
      }
      svg:hover .icon {
        fill: #00f3ff;
        filter: drop-shadow(0 0 5px #00f3ff);
        transform: scale(1.15) translate(-1.5px, -1.5px);
        transform-origin: 37px 32px;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="210" height="55" rx="10" class="badge-bg" />
  
  <!-- Glowing Animated Border on Hover -->
  <rect x="5" y="5" width="210" height="55" rx="10" class="badge-border" />
  
  <!-- LinkedIn Icon (Custom SVG Path) -->
  <g class="icon" transform="translate(25, 20)">
    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
  </g>
  
  <!-- Badge Text -->
  <text x="65" y="37" class="text">LINKEDIN</text>
</svg>
