<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code&amp;display=swap');
      
      .bg {
        fill: #030712;
        stroke: url(#glass-border);
        stroke-width: 1.5;
      }
      
      /* Back of envelope */
      .env-back {
        fill: #1e293b;
        stroke: #475569;
        stroke-width: 1.5;
        animation: env-pulse-purple 3s ease-in-out infinite;
      }

      /* Letter card inside (Active sliding loop) */
      .env-letter {
        fill: #00f0b5;
        animation: mail-slide-mint 4s ease-in-out infinite;
      }

      .env-front {
        fill: #0f172a;
        stroke: #475569;
        stroke-width: 1.5;
        animation: env-pulse-purple 3s ease-in-out infinite;
      }

      /* Envelope flap (Open envelope: points upwards) */
      .env-flap {
        fill: #1e1b4b;
        stroke: #475569;
        stroke-width: 1.5;
        animation: flap-pulse-purple 3s ease-in-out infinite;
      }

      .text {
        fill: #94a3b8;
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 1.5px;
        animation: text-glow-purple 3s ease-in-out infinite;
      }

      /* Glassmorphism Border Gradient */
      <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
        <stop offset="35%" stop-color="#00f0b5" stop-opacity="0.25" />
        <stop offset="75%" stop-color="#a855f7" stop-opacity="0.2" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
      </linearGradient>

      /* Looping Animations */
      @keyframes mail-slide-mint {
        0%, 100% { transform: translateY(0px); fill: #00f0b5; filter: none; }
        50% { transform: translateY(-13px); fill: #a855f7; filter: drop-shadow(0 0 4px #a855f7); }
      }

      @keyframes flap-pulse-purple {
        0%, 100% { fill: #1e1b4b; stroke: #475569; }
        50% { fill: #a855f7; stroke: #a855f7; filter: drop-shadow(0 0 3px #a855f7); }
      }

      @keyframes env-pulse-purple {
        0%, 100% { stroke: #475569; }
        50% { stroke: #a855f7; }
      }

      @keyframes text-glow-purple {
        0%, 100% { fill: #94a3b8; filter: none; }
        50% { fill: #ffffff; filter: drop-shadow(0 0 2px rgba(168, 85, 247, 0.4)); }
      }
    </style>
  </defs>

  <!-- Outer Card Panel -->
  <rect x="5" y="5" width="230" height="60" rx="10" class="bg" />

  <!-- Interactive Envelope (Absolute coordinates + Active CSS loops) -->
  <g>
    <!-- Letter that slides up & down -->
    <g class="env-letter">
      <rect x="28" y="24" width="34" height="20" rx="2" />
      <line x1="33" y1="29" x2="47" y2="29" stroke="#030712" stroke-width="1.5" />
      <line x1="33" y1="33" x2="57" y2="33" stroke="#030712" stroke-width="1.5" />
      <line x1="33" y1="37" x2="51" y2="37" stroke="#030712" stroke-width="1.5" />
    </g>

    <!-- Back of envelope -->
    <rect x="25" y="28" width="40" height="24" rx="2" class="env-back" />
    
    <!-- Front of envelope (lower cover) -->
    <path d="M 25,52 L 45,40 L 65,52 Z" class="env-front" />
    <path d="M 25,28 L 25,52 L 35,40 Z" class="env-front" />
    <path d="M 65,28 L 65,52 L 55,40 Z" class="env-front" />

    <!-- Flap (Open envelope: points upwards to y=16) -->
    <path d="M 25,28 L 45,16 L 65,28 Z" class="env-flap" />
  </g>

  <!-- Badge Text -->
  <text x="85" y="40" class="text">SEND EMAIL</text>
</svg>
