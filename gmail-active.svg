<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .bg {
        fill: #090d16;
        stroke: #1f2937;
        stroke-width: 1.5;
      }
      
      .border-glow {
        fill: none;
        stroke: #1f2937;
        stroke-width: 2;
        animation: border-pulse-pink 3s ease-in-out infinite;
      }

      /* Back of envelope */
      .env-back {
        fill: #1f2937;
        stroke: #4b5563;
        stroke-width: 1.5;
        animation: env-pulse 3s ease-in-out infinite;
      }

      /* Letter card inside (Active sliding loop) */
      .env-letter {
        fill: #00f3ff;
        animation: mail-slide 4s ease-in-out infinite;
      }

      .env-front {
        fill: #0d121f;
        stroke: #4b5563;
        stroke-width: 1.5;
        animation: env-pulse 3s ease-in-out infinite;
      }

      /* Envelope flap (Open envelope: points upwards) */
      .env-flap {
        fill: #1a2333;
        stroke: #4b5563;
        stroke-width: 1.5;
        animation: flap-pulse 3s ease-in-out infinite;
      }

      .text {
        fill: #9ca3af;
        font-family: 'Share Tech Mono', monospace;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 2px;
        animation: text-glow-pink 3s ease-in-out infinite;
      }

      /* Active Looping Keyframes */
      @keyframes mail-slide {
        0%, 100% { transform: translateY(0px); fill: #00f3ff; filter: none; }
        50% { transform: translateY(-13px); fill: #ff007f; filter: drop-shadow(0 0 4px #ff007f); }
      }

      @keyframes flap-pulse {
        0%, 100% { fill: #1a2333; stroke: #4b5563; }
        50% { fill: #ff007f; stroke: #ff007f; filter: drop-shadow(0 0 3px #ff007f); }
      }

      @keyframes env-pulse {
        0%, 100% { stroke: #4b5563; }
        50% { stroke: #ff007f; }
      }

      @keyframes border-pulse-pink {
        0%, 100% { stroke: #1f2937; filter: none; }
        50% { stroke: #ff007f; filter: drop-shadow(0 0 4px #ff007f); }
      }

      @keyframes text-glow-pink {
        0%, 100% { fill: #9ca3af; filter: none; }
        50% { fill: #ff007f; filter: drop-shadow(0 0 2px rgba(255, 0, 127, 0.4)); }
      }
    </style>
  </defs>

  <!-- Outer card -->
  <rect x="5" y="5" width="230" height="60" rx="10" class="bg" />
  <rect x="5" y="5" width="230" height="60" rx="10" class="border-glow" />

  <!-- Interactive Envelope (Absolute coordinates + Active CSS loops) -->
  <g>
    <!-- Letter that slides up & down -->
    <g class="env-letter">
      <rect x="28" y="24" width="34" height="20" rx="2" />
      <line x1="33" y1="29" x2="47" y2="29" stroke="#090d16" stroke-width="1.5" />
      <line x1="33" y1="33" x2="57" y2="33" stroke="#090d16" stroke-width="1.5" />
      <line x1="33" y1="37" x2="51" y2="37" stroke="#090d16" stroke-width="1.5" />
    </g>

    <!-- Back of envelope -->
    <rect x="25" y="28" width="40" height="24" rx="2" class="env-back" />
    
    <!-- Front of envelope (lower cover) -->
    <path d="M 25,52 L 45,40 L 65,52 Z" class="env-front" />
    <path d="M 25,28 L 25,52 L 35,40 Z" class="env-front" />
    <path d="M 65,28 L 65,52 L 55,40 Z" class="env-front" />

    <!-- Flap (Open envelope: points upwards to y=16) -->
    <path d="M 25,28 L 45,16 L 65,28 Z" class="env-flap" />
  </g>

  <!-- Badge Text -->
  <text x="85" y="40" class="text">SEND EMAIL</text>
</svg>
