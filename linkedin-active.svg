<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .bg {
        fill: #090d16;
        stroke: #1f2937;
        stroke-width: 1.5;
      }
      
      .border-glow {
        fill: none;
        stroke: #1f2937;
        stroke-width: 2;
        animation: border-pulse 3s ease-in-out infinite;
      }

      .net-node {
        fill: #4b5563;
        animation: node-glow 3s ease-in-out infinite;
      }
      .node-delay1 { animation-delay: 0.5s; }
      .node-delay2 { animation-delay: 1s; }

      .net-line {
        stroke: #1f2937;
        stroke-width: 1;
        fill: none;
        transition: stroke 0.3s ease;
      }

      .net-pulse {
        stroke: #00f3ff;
        stroke-width: 1.5;
        stroke-dasharray: 15 50;
        stroke-dashoffset: 65;
        fill: none;
        animation: pulse-flow 2s linear infinite;
      }

      .text {
        fill: #9ca3af;
        font-family: 'Share Tech Mono', monospace;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 2px;
        animation: text-glow 3s ease-in-out infinite;
      }

      .icon {
        fill: #9ca3af;
        transform: translate(25px, 23px);
        animation: icon-breath 4s ease-in-out infinite;
      }

      /* Active Looping Keyframes */
      @keyframes pulse-flow {
        0% { stroke-dashoffset: 65; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes node-glow {
        0%, 100% { fill: #4b5563; filter: none; }
        50% { fill: #00f3ff; filter: drop-shadow(0 0 3px #00f3ff); }
      }

      @keyframes icon-breath {
        0%, 100% { fill: #9ca3af; transform: translate(25px, 23px) scale(1); filter: none; }
        50% { fill: #00f3ff; transform: translate(25px, 23px) scale(1.08); filter: drop-shadow(0 0 4px #00f3ff); transform-origin: 37px 35px; }
      }

      @keyframes border-pulse {
        0%, 100% { stroke: #1f2937; filter: none; }
        50% { stroke: #00f3ff; filter: drop-shadow(0 0 4px #00f3ff); }
      }

      @keyframes text-glow {
        0%, 100% { fill: #9ca3af; filter: none; }
        50% { fill: #00f3ff; filter: drop-shadow(0 0 2px rgba(0, 243, 255, 0.4)); }
      }
    </style>
  </defs>

  <!-- Outer card -->
  <rect x="5" y="5" width="230" height="60" rx="10" class="bg" />
  <rect x="5" y="5" width="230" height="60" rx="10" class="border-glow" />

  <!-- Circuit/Neural Grid Background -->
  <g transform="translate(15, 10)">
    <!-- Connections -->
    <path d="M 5,25 L 20,10 L 40,10" class="net-line" />
    <path d="M 5,25 L 20,40 L 45,40" class="net-line" />
    <path d="M 20,10 L 20,40" class="net-line" />
    
    <!-- Animated Pulses -->
    <path d="M 5,25 L 20,10 L 40,10" class="net-pulse" />
    <path d="M 5,25 L 20,40 L 45,40" class="net-pulse" />

    <!-- Nodes -->
    <circle cx="5" cy="25" r="3" class="net-node" />
    <circle cx="20" cy="10" r="3.5" class="net-node node-delay1" />
    <circle cx="20" cy="40" r="3.5" class="net-node node-delay2" />
  </g>

  <!-- LinkedIn Icon -->
  <g class="icon">
    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
  </g>
  
  <!-- Badge Text -->
  <text x="85" y="40" class="text">LINKEDIN</text>
</svg>
