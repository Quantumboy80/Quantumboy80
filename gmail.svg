<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 65" width="220" height="65">
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .badge-bg {
        fill: #090d16;
        stroke: #1f2937;
        stroke-width: 1.5;
        transition: all 0.3s ease;
      }
      .badge-border {
        fill: none;
        stroke: #ff007f;
        stroke-width: 2;
        stroke-dasharray: 550;
        stroke-dashoffset: 550;
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        filter: drop-shadow(0 0 2px rgba(255, 0, 127, 0.4));
      }
      .text {
        fill: #9ca3af;
        font-family: 'Share Tech Mono', monospace;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 2px;
        transition: all 0.3s ease;
      }
      .icon {
        fill: #9ca3af;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      
      /* Hover State */
      svg:hover .badge-bg {
        fill: #190f18;
        stroke: #ff007f;
        filter: drop-shadow(0 0 4px rgba(255, 0, 127, 0.15));
      }
      svg:hover .badge-border {
        stroke-dashoffset: 0;
        filter: drop-shadow(0 0 6px #ff007f);
      }
      svg:hover .text {
        fill: #ff007f;
        filter: drop-shadow(0 0 2px rgba(255, 0, 127, 0.5));
      }
      svg:hover .icon {
        fill: #ff007f;
        filter: drop-shadow(0 0 5px #ff007f);
        transform: scale(1.15) translate(-1.5px, -1.5px);
        transform-origin: 37px 32px;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="210" height="55" rx="10" class="badge-bg" />
  
  <!-- Glowing Animated Border on Hover -->
  <rect x="5" y="5" width="210" height="55" rx="10" class="badge-border" />
  
  <!-- Gmail/Envelope Icon -->
  <g class="icon" transform="translate(25, 20)">
    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
  </g>
  
  <!-- Badge Text -->
  <text x="65" y="37" class="text">GMAIL</text>
</svg>
