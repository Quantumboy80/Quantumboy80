<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Inter:wght@300;400;600&amp;display=swap');
      
      svg {
        background-color: #030712;
        font-family: 'Inter', sans-serif;
      }
      
      .monospace {
        font-family: 'Fira Code', monospace;
      }

      /* Glow Filters */
      .glow-mint {
        filter: drop-shadow(0 0 4px rgba(0, 240, 181, 0.6));
      }
      .glow-purple {
        filter: drop-shadow(0 0 4px rgba(168, 85, 247, 0.6));
      }

      /* Blinking Cursor */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }

      /* Typing lines delayed simulation */
      @keyframes type-fade {
        0%, 15% { opacity: 0; transform: translateY(3px); }
        20%, 100% { opacity: 1; transform: translateY(0); }
      }
      .t-line1 { animation: type-fade 12s infinite; }
      .t-line2 { animation: type-fade 12s infinite; animation-delay: 1.5s; }
      .t-line3 { animation: type-fade 12s infinite; animation-delay: 3s; }
      .t-line4 { animation: type-fade 12s infinite; animation-delay: 4.5s; }
      .t-line5 { animation: type-fade 12s infinite; animation-delay: 6s; }
      .t-line6 { animation: type-fade 12s infinite; animation-delay: 7.5s; }

      /* Telemetry Grid Glow Pulse */
      @keyframes grid-pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      .grid-bg {
        animation: grid-pulse 8s ease-in-out infinite;
      }
    </style>

    <!-- Ambient Aurora Lights -->
    <radialGradient id="aurora-mint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0b5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Glassmorphism Edge Gradient -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="25%" stop-color="#00f0b5" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Core Glow Filters -->
    <filter id="glow-mint-filter">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple-filter">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid base background -->
  <rect width="850" height="380" fill="#030712" />

  <!-- Shifting Aurora Lights in Background (Slow Organic Drift) -->
  <circle cx="150" cy="300" r="220" fill="url(#aurora-mint)">
    <animate attributeName="cx" values="150;210;120;150" dur="22s" repeatCount="indefinite" />
    <animate attributeName="cy" values="300;240;330;300" dur="22s" repeatCount="indefinite" />
    <animate attributeName="r" values="220;250;200;220" dur="22s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="100" r="250" fill="url(#aurora-purple)">
    <animate attributeName="cx" values="700;640;740;700" dur="26s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;160;70;100" dur="26s" repeatCount="indefinite" />
    <animate attributeName="r" values="250;210;270;250" dur="26s" repeatCount="indefinite" />
  </circle>

  <!-- Technical Dot Grid -->
  <g class="grid-bg">
    <pattern id="dotgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.75" fill="#475569" opacity="0.7" />
    </pattern>
    <rect width="850" height="380" fill="url(#dotgrid)" />
  </g>

  <!-- Modern Layout Header Line -->
  <g transform="translate(30, 35)">
    <text x="0" y="0" fill="#ffffff" font-size="13" font-weight="600" letter-spacing="3" opacity="0.9">SAYAN SOM</text>
    <text x="110" y="0" fill="#475569" font-size="13" font-weight="300" letter-spacing="1">|</text>
    <text x="130" y="0" fill="#00f0b5" font-size="11" font-weight="600" letter-spacing="2" class="glow-mint">NEURAL_CORE_v2.0</text>
    
    <text x="790" y="0" fill="#94a3b8" font-size="11" text-anchor="end" font-weight="400" letter-spacing="1">SYSTEM ACTIVE</text>
    <circle cx="798" cy="-4" r="3.5" fill="#00f0b5" class="glow-mint" />
  </g>

  <!-- LEFT PANE: Gravitational / Orbital Data Ring Model -->
  <g transform="translate(10, 0)">
    <!-- Radial concentric grids -->
    <circle cx="150" cy="200" r="85" fill="none" stroke="#1e293b" stroke-width="0.75" />
    <circle cx="150" cy="200" r="60" fill="none" stroke="#1e293b" stroke-width="0.75" />
    <circle cx="150" cy="200" r="35" fill="none" stroke="#1e293b" stroke-width="0.75" />

    <!-- Orbital Trajectory Paths (Elegant ellipses) -->
    <path id="orbit1" d="M 50,200 C 50,140 250,140 250,200 C 250,260 50,260 50,200" fill="none" stroke="#334155" stroke-width="1.25" stroke-dasharray="3 4" />
    <path id="orbit2" d="M 75,200 C 75,130 225,130 225,200 C 225,270 75,270 75,200" fill="none" stroke="#334155" stroke-width="1.25" stroke-dasharray="3 4" transform="rotate(35 150 200)" />
    <path id="orbit3" d="M 85,200 C 85,120 215,120 215,200 C 215,280 85,280 85,200" fill="none" stroke="#334155" stroke-width="1.25" stroke-dasharray="3 4" transform="rotate(-35 150 200)" />

    <!-- Orbiting Data Particles (Moving along paths) -->
    <circle r="3.5" fill="#00f0b5" filter="url(#glow-mint-filter)">
      <animateMotion dur="8s" repeatCount="indefinite" path="M 50,200 C 50,140 250,140 250,200 C 250,260 50,260 50,200" />
    </circle>
    <circle r="3" fill="#a855f7" filter="url(#glow-purple-filter)">
      <animateMotion dur="11s" repeatCount="indefinite" path="M 75,200 C 75,130 225,130 225,200 C 225,270 75,270 75,200" />
    </circle>
    <circle r="2" fill="#ffffff">
      <animateMotion dur="14s" repeatCount="indefinite" path="M 85,200 C 85,120 215,120 215,200 C 215,280 85,280 85,200" />
    </circle>

    <!-- Center Core Glow -->
    <circle cx="150" cy="200" r="10" fill="rgba(0, 240, 181, 0.15)" stroke="#00f0b5" stroke-width="1.5" class="glow-mint" />
    <circle cx="150" cy="200" r="3.5" fill="#00f0b5" />
    
    <text x="150" y="325" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="2">DATA_WAVEFORM_ACTIVE</text>
  </g>

  <!-- Elegant Divider Line -->
  <line x1="310" y1="90" x2="310" y2="310" stroke="#1e293b" stroke-width="1" />

  <!-- RIGHT PANE: Modern Glassmorphism Terminal Console -->
  <g transform="translate(340, 75)">
    <!-- Card Glass Panel Background -->
    <rect width="470" height="235" rx="10" fill="rgba(15, 23, 42, 0.65)" stroke="url(#glass-border)" stroke-width="1.5" />
    
    <!-- Window Controls (Clean dots) -->
    <circle cx="20" cy="15" r="4.5" fill="#ff5f56" />
    <circle cx="32" cy="15" r="4.5" fill="#ffbd2e" />
    <circle cx="44" cy="15" r="4.5" fill="#27c93f" />
    <text x="65" y="19" fill="#475569" font-size="11" font-weight="500" class="monospace">core-terminal</text>
    
    <!-- Divider -->
    <line x1="0" y1="30" x2="470" y2="30" stroke="#1e293b" stroke-width="1.25" />

    <!-- Terminal Content (Monospace, Simulated Typing Lines) -->
    <!-- Line 1: User command -->
    <g class="t-line1" transform="translate(20, 60)">
      <text x="0" y="0" fill="#a855f7" font-weight="600" class="monospace">$</text>
      <text x="18" y="0" fill="#ffffff" font-weight="500" class="monospace">init_profile --user sayansom</text>
    </g>
    
    <!-- Line 2: Loading State -->
    <g class="t-line2" transform="translate(20, 88)">
      <text x="0" y="0" fill="#00f0b5" class="monospace">✔</text>
      <text x="18" y="0" fill="#94a3b8" class="monospace">Resolving neural telemetry ...</text>
      <text x="245" y="0" fill="#00f0b5" font-weight="600" class="monospace">[DONE]</text>
    </g>

    <!-- Line 3: Focus Area -->
    <g class="t-line3" transform="translate(20, 120)">
      <text x="0" y="0" fill="#a855f7" class="monospace">[info]</text>
      <text x="55" y="0" fill="#ffffff" font-weight="600" class="monospace">Focus:</text>
      <text x="110" y="0" fill="#94a3b8" class="monospace">Artificial Intelligence &amp; Data Science</text>
    </g>

    <!-- Line 4: Skills Stack -->
    <g class="t-line4" transform="translate(20, 148)">
      <text x="0" y="0" fill="#a855f7" class="monospace">[info]</text>
      <text x="55" y="0" fill="#ffffff" font-weight="600" class="monospace">Skills:</text>
      <text x="115" y="0" fill="#94a3b8" class="monospace">React | Next.js | TS | Node | Docker | ML</text>
    </g>

    <!-- Line 5: Objective -->
    <g class="t-line5" transform="translate(20, 178)">
      <text x="0" y="0" fill="#a855f7" class="monospace">[info]</text>
      <text x="55" y="0" fill="#ffffff" font-weight="600" class="monospace">Mission:</text>
      <text x="125" y="0" fill="#94a3b8" class="monospace">Translating complex AI ideas into simple code</text>
    </g>

    <!-- Line 6: Prompt & Cursor -->
    <g class="t-line6" transform="translate(20, 206)">
      <text x="0" y="0" fill="#a855f7" font-weight="600" class="monospace">$</text>
      <text x="18" y="0" fill="#ffffff" font-weight="500" class="monospace">await connection_init</text>
      <rect x="185" y="-12" width="7" height="15" fill="#00f0b5" class="cursor glow-mint" />
    </g>
  </g>
</svg>
